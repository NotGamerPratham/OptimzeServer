name: Maven Build, Test & GitHub Packages Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (cross-compiles universal Java 8 bytecode)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          cache: 'maven'

      - name: Compile, Run Automated Tests, and Package OptimizeServer.jar
        run: mvn -B clean test package

      - name: Upload OptimizeServer.jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptimizeServer
          path: target/OptimizeServer.jar

      # GitHub Packages rejects re-uploading an existing non-SNAPSHOT version with HTTP 409.
      # Treat that as "already published" so pushes after a release don't fail the check.
      - name: Publish Package to GitHub Packages Maven Registry
        if: github.event_name != 'pull_request'
        run: |
          if ! mvn -B deploy -DskipTests 2>&1 | tee deploy.log; then
            if grep -q "409" deploy.log; then
              echo "::notice::This version is already published to GitHub Packages; bump <version> in pom.xml to publish a new one."
            else
              exit 1
            fi
          fi
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

