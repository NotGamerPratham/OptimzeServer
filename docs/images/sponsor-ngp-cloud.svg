<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="220" viewBox="0 0 1376 220" role="img" aria-label="Sponsored by NGP Cloud - game server hosting">
  <title>Sponsored by NGP Cloud</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#14224a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1376" height="220" rx="18" fill="url(#bg)"/>
  <rect width="1376" height="220" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1374" height="218" rx="17" fill="none" stroke="#2c3a6b" stroke-width="2"/>
  <rect x="0" y="0" width="10" height="220" rx="5" fill="url(#accent)"/>

  <!-- Cloud mark -->
  <g transform="translate(90 62)" fill="url(#accent)">
    <circle cx="38" cy="62" r="30"/>
    <circle cx="78" cy="42" r="40"/>
    <circle cx="122" cy="62" r="30"/>
    <rect x="38" y="62" width="84" height="30" rx="2"/>
    <rect x="8" y="62" width="144" height="30" rx="15"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="290" y="82" font-size="22" letter-spacing="6" fill="#7dd3fc" font-weight="600">OFFICIAL SPONSOR</text>
    <text x="288" y="152" font-size="68" font-weight="800" fill="#ffffff">NGP Cloud</text>
    <text x="292" y="188" font-size="24" fill="#c7d2fe">Game server hosting for Minecraft and more</text>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="1086" y="86" width="220" height="56" rx="28" fill="url(#accent)"/>
    <text x="1196" y="122" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">ngpcloud.in</text>
  </g>
</svg>
